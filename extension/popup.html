<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMapLists</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 340px;
        margin: 0;
        background: #fafafa;
        color: #18181b;
      }

      main {
        padding: 14px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      p {
        margin: 3px 0 0;
        color: #71717a;
        font-size: 12px;
        line-height: 1.45;
      }

      form {
        display: grid;
        gap: 8px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: white;
        color: #18181b;
        padding: 0 10px;
        font-size: 12px;
        outline: none;
      }

      input:focus {
        border-color: #52525b;
      }

      button {
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: #18181b;
        color: white;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status {
        min-height: 16px;
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.4;
        color: #71717a;
      }

      #status.error {
        color: #dc2626;
      }

      #status.ok {
        color: #047857;
      }

      .hint {
        margin-top: 12px;
        border-top: 1px solid #e4e4e7;
        padding-top: 10px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafafa;
        }

        p,
        #status {
          color: #a1a1aa;
        }

        input {
          border-color: #3f3f46;
          background: #18181b;
          color: #fafafa;
        }

        input:focus {
          border-color: #a1a1aa;
        }

        button {
          background: #fafafa;
          color: #18181b;
        }

        .hint {
          border-top-color: #27272a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-32x32.png" alt="" />
        <div>
          <h1>GMapLists</h1>
          <p>Open one Maps list tab and send the capture to the app.</p>
        </div>
      </header>

      <form id="open-form">
        <input
          id="maps-url"
          type="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste Google Maps list URL"
        />
        <button id="open-button" type="submit">Open Focused Maps Tab</button>
      </form>

      <div id="status">Keep the deployed app open while Maps loads.</div>

      <p class="hint">
        Works with google.com/maps list links and maps.app.goo.gl short links.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
